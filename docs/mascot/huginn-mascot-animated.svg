<style>
* { animation-duration: 5s; animation-iteration-count: infinite; animation-timing-function: step-end; }
.hop    { animation-name: hop; }
.upper  { animation-name: breathe; }
.lids   { animation-name: blink; opacity: 0; }
.wing-l { animation-name: flap-l; }
.wing-r { animation-name: flap-r; }
@keyframes breathe { 0%,20%,40%,100% { transform: none; } 10%,30% { transform: translateY(16px); } }
@keyframes blink   { 0%,46%,49%,100% { opacity: 0; } 44%,47.5% { opacity: 1; } }
@keyframes hop     { 0%,72%,100% { transform: none; } 60% { transform: translateY(-16px); } 62%,68% { transform: translateY(-32px); } 70% { transform: translateY(-16px); } }
@keyframes flap-l  { 0%,58%,64%,70%,100% { transform: none; } 61%,67% { transform: translate(-16px,-16px); } }
@keyframes flap-r  { 0%,58%,64%,70%,100% { transform: none; } 61%,67% { transform: translate(16px,-16px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
