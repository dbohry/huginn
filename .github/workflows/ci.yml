name: CI

# Pull requests run the lint and tests. A merge to main does not run them again,
# because the pull request already did. Publishing the image is the Release
# workflow's job.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; echo "gofmt: files above need formatting"; exit 1; fi
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Bundle size budget
        run: npm run size

  # Drives the real binary in Chromium: the main journeys, a hostile feed, and an
  # accessibility scan of every screen. The test feeds are served from localhost.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: make build
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the image and check that it reports healthy
        run: |
          docker build -t huginn:ci .
          docker run -d --name huginn-ci huginn:ci
          for i in $(seq 1 20); do
            status="$(docker inspect --format '{{.State.Health.Status}}' huginn-ci)"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs huginn-ci
          echo "container did not become healthy (last status: $status)"
          exit 1
      # The release builds for arm64 too (Raspberry Pi), so check it here instead of
      # finding out at release time. It runs under emulation, so it is given longer.
      - name: Build the arm64 image and check that it answers
        run: |
          docker buildx build --platform linux/arm64 --load -t huginn:ci-arm64 .
          docker run -d --name huginn-arm --platform linux/arm64 -p 8081:8080 huginn:ci-arm64
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8081/healthz && exit 0
            sleep 2
          done
          docker logs huginn-arm
          echo "the arm64 container did not answer /healthz"
          exit 1
